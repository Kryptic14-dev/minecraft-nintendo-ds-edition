name: Build Nintendo DS ROM

on:
  push:
    branches:
      - new-world-system
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify toolchain
        run: |
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/ds_rules"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
      - name: Build ROM
        run: make
      - name: Verify ROM output
        run: |
          find . -maxdepth 1 -name '*.nds' -type f -size +0c -print -quit | grep .
      - name: Upload .nds ROM
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-nintendo-ds-edition-nds
          path: "*.nds"
          if-no-files-found: error
          retention-days: 14
