name: Build Nintendo DS ROM

on:
  push:
    branches:
      - new-world-system
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Nintendo DS development libraries
        shell: bash
        run: |
          set -euxo pipefail
          CONF=/opt/devkitpro/pacman/etc/pacman.conf
          # devkitPro's dkp-libs database is hosted at the packages root.
          # Do not append $repo/$arch here: that path returns 404.
          sed -i '/^\[dkp-libs\]/,/^\[/ s#^Server = .*#Server = https://pkg.devkitpro.org/packages#' "$CONF"
          sed -i '/^\[dkp-linux\]/,/^\[/ s#^Server = .*#Server = https://pkg.devkitpro.org/packages/linux/$arch#' "$CONF"
          cat "$CONF"
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed nds-dev
      - name: Verify toolchain
        run: |
          test -x "$DEVKITARM/bin/arm-none-eabi-gcc"
          test -f "$DEVKITARM/ds_rules"
          echo "$DEVKITARM/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/tools/bin" >> "$GITHUB_PATH"
          "$DEVKITARM/bin/arm-none-eabi-gcc" --version
      - name: Build ROM
        run: make
      - name: Verify ROM output
        run: |
          find . -maxdepth 1 -name '*.nds' -type f -size +0c -print -quit | grep .
      - name: Upload .nds ROM
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-nintendo-ds-edition-nds
          path: "*.nds"
          if-no-files-found: error
          retention-days: 14
